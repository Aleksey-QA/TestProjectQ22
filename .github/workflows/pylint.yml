name: Python Linting with Pylint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    # Шаг 1: Получить код из репозитория
    - name: Checkout repository
      uses: actions/checkout@v4
    
    # Шаг 2: Установить Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    # Шаг 3: Установить зависимости
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        
        # Если у вас есть requirements.txt, раскомментируйте:
        # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    # Шаг 4: Запустить Pylint
    - name: Run Pylint
      run: |
        echo "🔍 Запуск Pylint..."
        
        # Вариант 1: Для всех Python файлов в проекте
        pylint $(find . -name "*.py" -not -path "./.git/*" -not -path "./venv/*" -not -path "./.venv/*")
        
        # ИЛИ Вариант 2: Только для папки src/
        # pylint src/
        
        # ИЛИ Вариант 3: С конфигурационным файлом
        # if [ -f .pylintrc ]; then
        #   pylint --rcfile=.pylintrc **/*.py
        # else
        #   pylint **/*.py
        # fi
